<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Shift — Setup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #edf5ef; color: #183f2b; }
    main { width: 100%; max-width: 560px; padding: 36px; border-radius: 20px; background: white; box-shadow: 0 12px 40px #183f2b12; }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
    a { color: #17663e; }
    #status { padding: 16px; background: #edf5ef; border-radius: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Field Shift</h1>
    <h2>Project setup successful</h2>
    <p>This page is being delivered by your local server.</p>
    <p id="status" role="status" aria-live="polite">Checking the backend connection…</p>
    <p><a href="/api/health">View backend health check</a></p>
    <p>Your project foundation is ready. Farm location and NASA data features will be added in the next stages.</p>
  </main>
  <script>
    async function checkHealth() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error("Health check failed");
        const data = await response.json();
        if (data.status !== "ok") throw new Error("Unexpected response");
        status.textContent = "Backend connected. Server is running successfully.";
      } catch {
        status.textContent = "Backend connection failed. Check the server terminal and refresh this page.";
      }
    }
    checkHealth();
  </script>
</body>
</html>
